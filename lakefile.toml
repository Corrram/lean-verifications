name = "lean-verifications"
version = "0.1.0"
description = "Paper-specific Lean 4 formalizations and reproducible research supplements"
license = "Apache-2.0"
defaultTargets = ["Verification", "Papers"]

# Larger compiler thread stacks avoid Windows crashes in deeply nested analysis terms.
# This resource limit does not alter elaboration options or proof checking.
weakLeanArgs = ["-s", "65536"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
warningAsError = true

[[require]]
name = "copula"
git = "https://github.com/Corrram/copula.git"
# Includes all ten exact classical rank regions and approximation constructors.
rev = "72a596ebd8c111cb11a046be0d5c5cd64a878954"

[[require]]
name = "lean-mirror"
git = "https://github.com/Corrram/lean-mirror.git"
rev = "b8e7b2fc05db9742a1d37170418b9b15b184142a"

[[lean_lib]]
name = "Verification"
globs = ["Verification.*"]

[[lean_lib]]
name = "Papers"
# Compile every paper module, including ones not yet imported by its Main file.
globs = ["Papers.*"]
