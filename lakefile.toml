name = "lean-verifications"
version = "0.1.0"
description = "Paper-specific Lean 4 formalizations and reproducible research supplements"
license = "Apache-2.0"
defaultTargets = ["Verification", "Papers"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
warningAsError = true

[[require]]
name = "copula"
git = "https://github.com/Corrram/copula.git"
# Includes exact family dependence, Nelsen 7 xi/Schur, and Frechet optimization proofs.
rev = "765dfec9bdd19c41414738718e818f25e2fe825f"

[[lean_lib]]
name = "Verification"
globs = ["Verification.*"]

[[lean_lib]]
name = "Papers"
# Compile every paper module, including ones not yet imported by its Main file.
globs = ["Papers.*"]
