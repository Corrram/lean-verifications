name = "lean-verifications"
version = "0.1.0"
description = "Paper-specific Lean 4 formalizations and reproducible research supplements"
license = "Apache-2.0"
defaultTargets = ["Companion", "Verification", "Papers"]

# Larger compiler thread stacks avoid Windows crashes in deeply nested analysis terms.
# This resource limit does not alter elaboration options or proof checking.
weakLeanArgs = ["-s", "65536"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
warningAsError = true

[[require]]
name = "copula"
git = "https://github.com/Corrram/copula.git"
# Includes all ten exact classical rank regions and approximation constructors.
rev = "72a596ebd8c111cb11a046be0d5c5cd64a878954"

[[require]]
# Compiles the LaTeX sources in `Papers/*/Source` (formerly lean-mirror).
name = "proofread"
git = "https://github.com/Corrram/proofread.git"
rev = "e5c8725509c2b0d13f703e255ed6c5f4bca62fa3"

[[lean_lib]]
# The earlier companion engine (typed controlled language, proof trees and
# article evidence), kept for the existing paper companions.
name = "Companion"
globs = ["Companion.*"]

[[lean_lib]]
name = "Verification"
globs = ["Verification.*"]

[[lean_lib]]
name = "Papers"
# Compile every paper module, including ones not yet imported by its Main file.
globs = ["Papers.*"]
