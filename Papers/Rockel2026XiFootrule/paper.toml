scope = "Theorems 2.1, 2.4, 3.2, and 3.4, Propositions 2.2, 3.1, and 3.5, and Corollary 2.5 are checked. Theorem 3.3's convexity, entire xi=1 boundary, fixed-footrule interpolation, and exact nonnegative-footrule region are verified. Its inverse lower estimate is checked for footrule in [-1/2,0], with parameter uniqueness on [0,2]. Remark 2.3's asymmetric SI equality example is constructed and checked, including its derivative, xi=footrule=1/2, and asymmetry. The two-parameter density construction is checked on the full closed parameter square, including its independence and checkerboard endpoints. The full region is now proved closed and compact, and every boundary slice attains its extremum. The arXiv v1 LTD example is proved not LTD; the corrected example printed in the final JCAM article is verified with exact ranks. The exact lower-semilinear region is proved independently of stochastic increase. Finite nested ordinal sums of independence and comonotonic blocks are now proved SI and symmetric with xi=footrule; SI is also preserved by binary ordinal sums, and the interior equality converse is checked for SI components. Adjacent countable sums of independence blocks are now proved symmetric with binary splits at every partition endpoint, an exact Pi first component, a recursive tail decomposition, stochastic increase, and xi=footrule equality. For arbitrary adjacent countable blocks, SI and exchangeability hold exactly when they hold in each block; in the SI class xi=footrule also holds exactly when it holds in each block. In particular, every adjacent countable Pi/M sum is symmetric, SI and has xi=footrule. The full arbitrary-interval converse classification and full journal-version mapping remain pending."
