scope = "Theorems 2.1, 2.4, 3.2, and 3.4, Propositions 2.2, 3.1, and 3.5, and Corollary 2.5 are checked. Theorem 3.3's convexity, entire xi=1 boundary, fixed-footrule interpolation, and exact nonnegative-footrule region are verified. Its inverse lower estimate is checked for footrule in [-1/2,0], with parameter uniqueness on [0,2]. Remark 2.3's asymmetric SI equality example is constructed and checked, including its derivative, xi=footrule=1/2, and asymmetry. The two-parameter density construction is checked on the full closed parameter square, including its independence and checkerboard endpoints. The full region is now proved closed and compact, and every boundary slice attains its extremum. The printed LTD example is proved not LTD; a corrected LTD example with exact ranks is supplied. The exact lower-semilinear region is proved independently of stochastic increase. Finite nested ordinal sums of independence and comonotonic blocks are now proved SI and symmetric with xi=footrule; SI is also preserved by binary ordinal sums, and the interior equality converse is checked for SI components. Adjacent countable sums of independence blocks are now proved symmetric with binary splits at every partition endpoint and an exact Pi first component. Their SI and xi=footrule properties, the full arbitrary-countable classification, and journal-version comparison remain pending."
