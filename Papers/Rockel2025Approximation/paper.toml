scope = "Propositions 3.1-3.3 and Corollary 3.4 are fully checked: Bernstein formulas, permutation shuffles, all rectangular patchwork ranks and tails, and xi approximation bounds. Constructors and uniform CDF approximation are checked. The quadratic majorization step, estimator range and vanishing correction are checked. Theorem 4.2 is fully checked, including the MTP2-density implication and the actual checkerboard conditional integrals. Population checkerboard xi convergence and a quantitative CDF-error consistency criterion are checked for arbitrary copulas. The sampled-checkerboard almost-sure consistency and complexity claims in Theorem 4.5 remain pending."
