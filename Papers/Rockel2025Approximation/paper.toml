scope = "Propositions 3.1 and 3.2 are fully checked: all Bernstein rank formulas and both tails for every positive rectangular degree, and all equal-width straight permutation-shuffle formulas. The printed piecewise Upsilon matrix and the exceptional Theta corner convention are included. Constructors and uniform CDF approximation are checked for Bernstein and rectangular patchwork copulas. Proposition 3.3(i)-(ii) is checked for arbitrary rectangular cell matrices: exact checkerboard rho and tau formulas, check-min/check-W corrections, and general local-copula corrections. Proposition 3.3(iii) and Corollary 3.4 are checked: the exact checkerboard xi matrix formula, arbitrary local perfect-dependence corrections and the rectangular xi error bound (also valid for arbitrary fillings). General patchwork tails and Theorems 4.2 and 4.5 remain pending."
