scope = "The exact rho-footrule and mean-variance regions, finite-ranking inequalities, mixability infimum, and xi/correlation-ratio outer bounds are checked. Example 2.8 has its exact folded-uniform law, xi=1/4 and eta=0. Example 2.9 has a uniform quantitative gap. Proposition 2.10 is checked in full: the lower curve, every localized upper branch, compactness and full projection of the seed set, the attained concave upper envelope, and the entire inner enclosure. Remark 2.2 has the exact finite-ranking equality/divisibility criterion and strict correction away from contact means. Optimizer uniqueness, comparison with the earlier rho-footrule curve, finite-ranking asymptotic sharpness, and compactness and upper-maximum attainment for the full xi-eta region remain pending."
