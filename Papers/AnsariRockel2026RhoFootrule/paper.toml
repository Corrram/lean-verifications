scope = "The exact rho-footrule and mean-variance regions, finite-ranking inequalities, mixability infimum, and xi/correlation-ratio outer bounds are checked. Example 2.8 has its exact folded-uniform law, xi=1/4 and eta=0. Example 2.9 has a uniform quantitative gap. Proposition 2.10 is checked in full: the lower curve, every localized upper branch, compactness and full projection of the seed set, the attained concave upper envelope, and the entire inner enclosure. Remark 2.2 has the exact finite-ranking equality/divisibility criterion and strict correction away from contact means. Both finite-ranking moment bounds are asymptotically sharp at every admissible mean, via uniform approximation by actual permutation shuffles. The full comparison with the earlier rho-footrule curve is checked: equality on [-1/2,1/4], every contact point and the endpoint, and strict improvement on both line segments of every later contact interval. Optimizer uniqueness and compactness and upper-maximum attainment for the full xi-eta region remain pending."
