scope = "The full explicit xi-rho region (Theorem 1), SI/SD inequality (Theorem 2), and sharp global gap 2/5 (Corollary 1) are verified, with every boundary and equality case. The original diagonal-band family has checked piecewise intercepts, xi/rho coefficients, both explicit inverse branches, parameter ordering, radial symmetry, and all uniform limiting cases. Example 1's PLOD shuffle is checked with xi=1 and rho=13/16. Absolute continuity, density/support and MTP2, the Kendall tau formula, and journal-version comparison remain pending."
