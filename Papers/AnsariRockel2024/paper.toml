sure, including across the diagonal, and an antitone maximum-factor proof verifies every TP2 minor. A non-independent delta=1/2 counterexample refutes the printed exclusion. CI and PQD hold on [0,1], while CD and NQD each hold exactly at delta=0. Raftery now has increasing lower-orthant and both-direction Schur parameter orders on the whole closed interval. An exact power-integral representation shows that the gap from comonotonicity decreases with the shape parameter; CI transfers this to Schur order. Raftery Kendall tau is now exactly 2*delta/(3-delta) on the full closed interval, proved by integrating the actual CDF against its identified density. Symmetry and three exact power integrals give the interior value, and both endpoint values are separately checked. For arbitrary max-stable bivariate copulas, canonical Pickands bounds and homogeneous, submodular, coordinate-Lipschitz logarithmic structure are now derived without density assumptions. Convexity of the logarithmic sections is now proved without regularity assumptions: homogeneity and submodularity imply geometric Jensen comparisons, and a compact-maximum argument upgrades these to ordinary convexity. Supporting slopes in [0,1], the real-power Bernoulli inequality, and boundary continuity now transfer this to concavity of the original copula sections. General CI and both directional Schur/Pickands equivalences therefore hold for every max-stable bivariate copula, without a separate CI or density assumption. Canonical Pickands convexity is now verified on the entire closed interval. Homogeneity gives its perspective representation; affine supports of the logarithmic section become affine supports of the Pickands function, including the endpoint through the slope bound. The defining Pickands bounds, endpoint values, convexity and CDF representation are therefore all derived from the actual max-stable copula. Ali-Mikhail-Haq Chatterjee xi is now derived for every -1<=theta<1, with the logarithmic Table 6 form