scope = "Selected Tables 1-6 results are checked: FGM, Frechet and Mardia association formulas and tails; FGM conditional monotonicity, lower orthant order and its actual density with TP2 classification; Nelsen 7 CDF, endpoints, CD, parameter order and both tail limits. Both tail limits for Gumbel, Marshall-Olkin, Cuadras-Auge and Tawn, the exact FGM Schur order, and the corrected Frechet parameter order are also checked. Lemmas 2.6 and 2.8 (both directions on the monotone classes) and Proposition 3.2 are fully checked, as are copula-level concordance and xi consistency and both tail-order implications. Theorem 3.4(i)-(ii) is checked from max-stability, and each directional Schur equivalence and both xi consequences are checked under an explicit CI hypothesis; ordered extreme-value rho, tau and tail limits are also checked; Marshall-Olkin and Cuadras-Auge CI, lower orthant and both-direction Schur parameter orders are checked on the full interval. Cuadras-Auge also has its actual conditional CDF and all three exact Table 6 formulas (rho, xi, tau) checked; Marshall-Olkin has its actual conditional CDF and full two-parameter rho, xi and tau formulas checked. Exact density-TP2 and absolute-continuity classifications are checked for both common-shock families. Other family entries, remaining general order correspondences and journal comparison remain pending."
