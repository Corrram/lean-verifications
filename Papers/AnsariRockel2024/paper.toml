[[source_discrepancies]]
version = "arXiv v3 Appendix A.4.1/equation (23); published DOI 10.1515/demo-2024-0002 Appendix A.4.1/equation (A7)"
unverified_claim = "The Appendix A.4.1 Fréchet parameter constraint and equation (23) Mardia W weight yield the intended copula mixtures."
evidence = "The printed Fréchet inequality is reversed and the Mardia W weight can be negative; the literal parameterizations are excluded from the Lean constructors."
verified_instead = "Theorems use the valid Fréchet simplex and nonnegative Mardia W weight."

