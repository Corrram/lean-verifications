ing lower-orthant order and increasing Schur order in both directions are checked throughout 0<=theta<=eta<=1. Concavity of the exact trigonometric generator comparison follows from a squared-derivative inequality and Bernoulli inequality; subadditivity and a cutoff bound prove the CDF order, with NQD supplying the independence endpoint. Tawn now has full-square finite-shape continuity, increasing lower-orthant shape order, and convergence to Marshall-Olkin at infinite shape for all weights in [0,1]. Its unit-weight Gumbel subfamily has TP2 density and is non-independent for shape>1, formally refuting the blanket negative TP2 entry in arXiv v3 Table 5. The canonical Table 4 Pickands functions of Tawn, Gumbel, Marshall-Olkin and Cuadras-Auge are identified from their actual copulas on the full closed interval. Tawn CI and both directional Schur shape orders are now checked for all weights, by a general proof that max-product with independence preserves CI. The proof uses power-perspective concavity and includes zero and unit weights. Tawn density classification at other weights remains pending. The signed Frank family now has increasing lower-orthant order throughout the real line and both directional Schur orders on each side of independence, via its exact transformation to Nelsen 17. Frank Table 6 association formulas remain pending. Plackett now has an actual copula constructor for all theta>0, the full-square square-root CDF away from theta=1, the independence member at theta=1, and an identified Lebesgue density. Plackett CI/PQD hold exactly for theta>=1 and CD/NQD exactly for theta<=1, proved through section curvature and the midpoint CDF. Plackett has both zero tail coefficients for all finite positive parameters, full-square parameter continuity including independence, and endpoint limits W at zero and M at infinity. Plackett lower-orthant order is equivalent to parameter order, and both directional Schur orders increase above independence and decrease below 