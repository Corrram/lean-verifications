scope = "Selected Tables 1-6 results are checked: both Clayton CDF branches, special and limiting cases, and exact signed Clayton CI/CD classification, quadrant dependence, CDF-level TP2 classification, full signed density-TP2 classification and positive-parameter absolute continuity, and both tail coefficients; FGM, Frechet and Mardia association formulas and tails; FGM conditional monotonicity, lower orthant order and exact MTP2 classification of its actual density; Nelsen 7 CDF, endpoints, CD, exact CDF-TP2 and density-TP2 ranges, parameter order, both tail limits, and exact Spearman rho. Both tail limits for Gumbel, Marshall-Olkin, Cuadras-Auge and Tawn, the exact FGM Schur order, and the corrected Frechet parameter order are also checked. Lemmas 2.6 and 2.8 (both directions on the monotone classes) and Proposition 3.2 are fully checked, as are copula-level concordance and xi consistency and both tail-order implications. Theorem 3.4(i)-(ii) is checked from max-stability, and each directional Schur equivalence and both xi consequences are checked under an explicit CI hypothesis; ordered extreme-value rho, tau and tail limits are also checked; Marshall-Olkin and Cuadras-Auge CI, lower orthant and both-direction Schur parameter orders are checked on the full interval. Cuadras-Auge also has its actual conditional CDF and all three exact Table 6 formulas (rho, xi, tau) checked; Marshall-Olkin has its actual conditional CDF and full two-parameter rho, xi and tau formulas checked. Exact density-TP2 and absolute-continuity classifications are checked for both common-shock families. The positive Clayton analytic mixed derivative is identified with the package density candidate; positive-rectangle and lower-orthant measure equality, full measure identification, actual MTP2 density and absolute continuity are checked. A general MTP2-density-to-PQD theorem excludes every negative Clayton parameter, completing the signed density-TP2 split. The Ali–Mikhail–Haq rational CDF, exact CI/CD and PQD/NQD parameter ranges, corrected tail pair, exact lower-orthant and same-sign Schur parameter orders, and CDF TP2 are checked; actual density TP2 holds exactly for nonnegative theta on the full signed interval, including both endpoints, and the positive-interior rational density is identified with the copula measure by integration. Frank has the exact signed CI/CD, quadrant-dependence and full density-TP2 classifications checked. A continuous positive-parameter density is integrated twice and identified with the actual copula measure; density TP2 and CI each hold exactly for nonnegative parameters, while CD holds exactly for nonpositive parameters. The two-sided Frank independence limit at zero and both full-square infinite-parameter Frank endpoints are checked, with a global log(2)/theta bound on the positive branch. Both Frank tail coefficients are zero on the full finite real parameter range. The negative Frank reflected CDF, its exact printed negative logarithmic rewriting on the closed square, and the independence case at zero are checked. Nelsen 8 rational CDF and lower-Fréchet endpoint are checked. Joe, Nelsen 2, and Nelsen 8 tail limits, Nelsen 2 full-square infinite-parameter endpoint, lower-orthant order and exact CI/CD and TP2 classifications, and Joe, Nelsen 8, Nelsen 12 and Gumbel-Hougaard full-square infinite-parameter endpoints, Nelsen 8 and Nelsen 12 lower-orthant parameter order; Nelsen 8 non-PQD/non-CI and TP2 exclusions and exact CD classification; Gumbel-Hougaard lower-orthant parameter order are checked for all finite theta>=1. Its theta=1 independence endpoint is explicitly audited. Gumbel-Hougaard is now CI and increasing in both-direction Schur order for every finite theta>=1; Joe is also CI on that full range. Joe also has increasing lower-orthant and both-direction Schur parameter orders checked across that full range. Joe has an actual TP2 density for every finite theta>=1: the positive, log-convex second generator derivative gives TP2, and two integrations on interior rectangles followed by boundary exhaustion identify the density with the copula measure. Gumbel-Hougaard likewise has an actual TP2 density on the full finite theta>=1 range, proved through the positive log-convex second generator derivative and interior-rectangle measure identification. Nelsen 12 has both exact Table 3 tail coefficients. Nelsen 14 has both exact Table 3 tail coefficients. Nelsen 14 and Genest–Ghoudi now also have their full-square infinite-parameter endpoints. Nelsen 12 and 14 have CI, CDF TP2 and MTP2 density checked at their common theta=1 Clayton endpoint. Both families are now CI for all finite theta>=1, via the shared BB1 generator proof; Nelsen 12 also has increasing both-direction Schur parameter order on that full range. Nelsen 14 now has increasing lower-orthant and both-direction Schur parameter orders for every finite 1<=theta<=eta, via a normalized-power generator comparison and the established CI theorem. Both Nelsen 12 and 14 now have actual TP2 densities for every finite theta>=1, by a shared full two-parameter BB1 density theorem. Positivity and log-convexity of the second generator derivative give TP2, while interior integration and boundary exhaustion identify the measure. Both are non-CD for all finite theta>=1, and both Nelsen 12 and 14 are PQD throughout that range. CDF-level TP2 is now checked for Nelsen 12, Nelsen 14, Gumbel, Tawn, Marshall-Olkin and Cuadras-Auge across all admissible finite parameters; density-level TP2 beyond the previously checked cases remains pending. Genest–Ghoudi has both exact Table 3 tail coefficients. Its exact non-CI, CD, CDF-level TP2 and MTP2-density classifications are also checked. Gumbel–Barnett now has an actual measure constructor, full-square CDF, continuous parameter dependence including independence at zero, full CI/CD and density-TP2 classifications, exact lower-orthant and Schur parameter orders, both zero tail coefficients, and its exact Table 6 exponential-integral xi formula with the independence endpoint. Nelsen 10 has an actual measure constructor, printed full-square CDF, endpoint identities, independence limit at zero, CD on the full closed parameter interval, exact CI and density-TP2 classifications, quadrant dependence and both zero tail coefficients checked. Its unordered-parameter entries are witnessed by an exact pair incomparable in lower-orthant and Schur order. Nelsen 11 has an actual truncated-generator measure constructor, full-square printed CDF, independence member and limit at zero, CD on the full closed parameter interval, decreasing lower-orthant and increasing both-direction Schur parameter orders, exact CI and density-TP2 classifications, quadrant dependence and both zero tail coefficients checked. Nelsen 13 has an actual measure constructor, printed full-square CDF, Gumbel–Barnett member at zero, independence at one, and both zero tail coefficients for every finite nonnegative parameter checked. Both full-square endpoint limits (Gumbel–Barnett at zero and comonotonicity at infinity) and increasing lower-orthant parameter order on the entire nonnegative range are checked. Its exact CI classification (theta>=1), increasing both-direction Schur order on that range, and exclusion of TP2 Lebesgue densities below one are checked. Density TP2 holds exactly for theta>=1: the measurable mixed-derivative density is proved TP2 and identified with the actual copula measure through positive-rectangle integration and measure exhaustion. Nelsen 16 now has an actual measure constructor and printed full-square square-root CDF for every finite theta>=0, with the countermonotonic member at zero, continuous parameter dependence, and the full-square limit to W at zero. Nelsen 16 also has increasing lower-orthant parameter order on the full nonnegative range and the full-square infinite-parameter limit to Clayton(1), proved from the quadratic CDF identity and an explicit error bound. Both Nelsen 16 tails are checked: lower=1/2 for every finite positive parameter, lower=0 at zero, and upper=0 throughout the nonnegative range. Nelsen 16 is now proved CI for every finite theta>=3, and increasing in both-direction Schur order for 3<=theta<=eta, using checked log-convexity of the negative inverse-generator derivative. Nelsen 16 has its actual mixed-derivative density identified for every positive parameter, and density TP2 is proved for theta>=3+2*sqrt(2), using log-convexity of the second generator derivative. The exact Nelsen 16 CI classification is now checked: CI holds iff theta>=3, with necessity derived from actual CDF-section concavity and a one-sided corner derivative. The exact Nelsen 16 density-TP2 classification is also checked: a TP2 density exists iff theta>=3+2*sqrt(2), with necessity invariant under changes on null sets and derived from a corner midpoint inequality. Nelsen 19 now has an actual measure constructor throughout theta>=0, the printed positive-parameter logarithmic CDF on the full square, the harmonic zero member and full-square convergence to it along every nonnegative parameter path tending to zero. CI and both tails are checked on the full range: lower=1 for positive parameters and 1/2 at zero, upper=0 throughout. Nelsen 19 density TP2, parameter orders and its infinite endpoint remain pending. Other family entries, remaining general order correspondences and journal comparison remain pending."
