scope = "Selected Tables 1-6 results are checked: both Clayton CDF branches, special and limiting cases, and exact signed Clayton CI/CD classification, quadrant dependence, CDF-level TP2 classification, full signed density-TP2 classification and positive-parameter absolute continuity, and both tail coefficients; FGM, Frechet and Mardia association formulas and tails; FGM conditional monotonicity, lower orthant order and exact MTP2 classification of its actual density; Nelsen 7 CDF, endpoints, CD, exact CDF-TP2 and density-TP2 ranges, parameter order, both tail limits, and exact Spearman rho. Both tail limits for Gumbel, Marshall-Olkin, Cuadras-Auge and Tawn, the exact FGM Schur order, and the corrected Frechet parameter order are also checked. Lemmas 2.6 and 2.8 (both directions on the monotone classes) and Proposition 3.2 are fully checked, as are copula-level concordance and xi consistency and both tail-order implications. Theorem 3.4(i)-(ii) is checked from max-stability, and each directional Schur equivalence and both xi consequences are checked under an explicit CI hypothesis; ordered extreme-value rho, tau and tail limits are also checked; Marshall-Olkin and Cuadras-Auge CI, lower orthant and both-direction Schur parameter orders are checked on the full interval. Cuadras-Auge also has its actual conditional CDF and all three exact Table 6 formulas (rho, xi, tau) checked; Marshall-Olkin has its actual conditional CDF and full two-parameter rho, xi and tau formulas checked. Exact density-TP2 and absolute-continuity classifications are checked for both common-shock families. The positive Clayton analytic mixed derivative is identified with the package density candidate; positive-rectangle and lower-orthant measure equality, full measure identification, actual MTP2 density and absolute continuity are checked. A general MTP2-density-to-PQD theorem excludes every negative Clayton parameter, completing the signed density-TP2 split. The Ali–Mikhail–Haq rational CDF, exact CI/CD and PQD/NQD parameter ranges, corrected tail pair, exact lower-orthant and same-sign Schur parameter orders, and CDF TP2 are checked; actual density TP2 holds exactly for nonnegative theta on the full signed interval, including both endpoints, and the positive-interior rational density is identified with the copula measure by integration. Frank has the exact signed CI/CD, quadrant-dependence and full density-TP2 classifications checked. A continuous positive-parameter density is integrated twice and identified with the actual copula measure; density TP2 and CI each hold exactly for nonnegative parameters, while CD holds exactly for nonpositive parameters. The two-sided Frank independence limit at zero and both full-square infinite-parameter Frank endpoints are checked, with a global log(2)/theta bound on the positive branch. Both Frank tail coefficients are zero on the full finite real parameter range. The negative Frank reflected CDF, its exact printed negative logarithmic rewriting on the closed square, and the independence case at zero are checked. Nelsen 8 rational CDF and lower-Fréchet endpoint are checked. Joe, Nelsen 2, and Nelsen 8 tail limits, Nelsen 2 full-square infinite-parameter endpoint, lower-orthant order and exact CI/CD and TP2 classifications, and Joe, Nelsen 8, Nelsen 12 and Gumbel-Hougaard full-square infinite-parameter endpoints, Nelsen 8 and Nelsen 12 lower-orthant parameter order; Nelsen 8 non-PQD/non-CI and TP2 exclusions and exact CD classification; Gumbel-Hougaard lower-orthant parameter order are checked for all finite theta>=1. Its theta=1 independence endpoint is explicitly audited. Gumbel-Hougaard is now CI and increasing in both-direction Schur order for every finite theta>=1; Joe is also CI on that full range. Joe also has increasing lower-orthant and both-direction Schur parameter orders checked across that full range. Joe has an actual TP2 density for every finite theta>=1: the positive, log-convex second generator derivative gives TP2, and two integrations on interior rectangles followed by boundary exhaustion identify the density with the copula measure. Gumbel-Hougaard likewise has an actual TP2 density on the full finite theta>=1 range, proved through the positive log-convex second generator derivative and interior-rectangle measure identification. Nelsen 12 has both exact Table 3 tail coefficients. Nelsen 14 has both exact Table 3 tail coefficients. Nelsen 14 and Genest–Ghoudi now also have their full-square infinite-parameter endpoints. Nelsen 12 and 14 have CI, CDF TP2 and MTP2 density checked at their common theta=1 Clayton endpoint. Both families are now CI for all finite theta>=1, via the shared BB1 generator proof; Nelsen 12 also has increasing both-direction Schur parameter order on that full range. Nelsen 14 now has increasing lower-orthant and both-direction Schur parameter orders for every finite 1<=theta<=eta, via a normalized-power generator comparison and the established CI theorem. Both Nelsen 12 and 14 now have actual TP2 densities for every finite theta>=1, by a shared full two-parameter BB1 density theorem. Positivity and log-convexity of the second generator derivative give TP2, while interior integration and boundary exhaustion identify the measure. Both are non-CD for all finite theta>=1, and both Nelsen 12 and 14 are PQD throughout that range. CDF-level TP2 is now checked for Nelsen 12, Nelsen 14, Gumbel, Tawn, Marshall-Olkin and Cuadras-Auge across all admissible finite parameters; density-level TP2 beyond the previously checked cases remains pending. Genest–Ghoudi has both exact Table 3 tail coefficients. Its exact non-CI, CD, CDF-level TP2 and MTP2-density classifications are also checked. Gumbel–Barnett now has an actual measure constructor, full-square CDF, continuous parameter dependence including independence at zero, full CI/CD and density-TP2 classifications, exact lower-orthant and Schur parameter orders, both zero tail coefficients, and its exact Table 6 exponential-integral xi formula with the independence endpoint. Nelsen 10 has an actual measure constructor, printed full-square CDF, endpoint identities, independence limit at zero, CD on the full closed parameter interval, exact CI and density-TP2 classifications, quadrant dependence and both zero tail coefficients checked. Its unordered-parameter entries are witnessed by an exact pair incomparable in lower-orthant and Schur order. Nelsen 11 has an actual truncated-generator measure constructor, full-square printed CDF, independence member and limit at zero, CD on the full closed parameter interval, decreasing lower-orthant and increasing both-direction Schur parameter orders, exact CI and density-TP2 classifications, quadrant dependence and both zero tail coefficients checked. Nelsen 13 has an actual measure constructor, printed full-square CDF, Gumbel–Barnett member at zero, independence at one, and both zero tail coefficients for every finite nonnegative parameter checked. Both full-square endpoint limits (Gumbel–Barnett at zero and comonotonicity at infinity) and increasing lower-orthant parameter order on the entire nonnegative range are checked. Its exact CI classification (theta>=1), increasing both-direction Schur order on that range, and exclusion of TP2 Lebesgue densities below one are checked. Density TP2 holds exactly for theta>=1: the measurable mixed-derivative density is proved TP2 and identified with the actual copula measure through positive-rectangle integration and measure exhaustion. Nelsen 16 now has an actual measure constructor and printed full-square square-root CDF for every finite theta>=0, with the countermonotonic member at zero, continuous parameter dependence, and the full-square limit to W at zero. Nelsen 16 also has increasing lower-orthant parameter order on the full nonnegative range and the full-square infinite-parameter limit to Clayton(1), proved from the quadratic CDF identity and an explicit error bound. Both Nelsen 16 tails are checked: lower=1/2 for every finite positive parameter, lower=0 at zero, and upper=0 throughout the nonnegative range. Nelsen 16 is now proved CI for every finite theta>=3, and increasing in both-direction Schur order for 3<=theta<=eta, using checked log-convexity of the negative inverse-generator derivative. Nelsen 16 has its actual mixed-derivative density identified for every positive parameter, and density TP2 is proved for theta>=3+2*sqrt(2), using log-convexity of the second generator derivative. The exact Nelsen 16 CI classification is now checked: CI holds iff theta>=3, with necessity derived from actual CDF-section concavity and a one-sided corner derivative. The exact Nelsen 16 density-TP2 classification is also checked: a TP2 density exists iff theta>=3+2*sqrt(2), with necessity invariant under changes on null sets and derived from a corner midpoint inequality. Nelsen 19 now has an actual measure constructor throughout theta>=0, the printed positive-parameter logarithmic CDF on the full square, the harmonic zero member and full-square convergence to it along every nonnegative parameter path tending to zero. CI and both tails are checked on the full range: lower=1 for positive parameters and 1/2 at zero, upper=0 throughout. Nelsen 19 increasing lower-orthant and both-direction Schur orders are checked throughout 0<=theta<=eta, including the harmonic zero endpoint via its checked limit. Its CDF converges on the full closed square to M as theta tends to infinity, with an explicit diagonal lower bound. Nelsen 19 now has an actual TP2 density throughout theta>=0. For positive parameters the measurable mixed-derivative formula is identified with the copula measure by interior-rectangle integration, and log-convexity of the second inverse-generator derivative gives TP2; the harmonic zero member inherits its TP2 density from Clayton(1). Nelsen 20 now has an actual copula constructor throughout theta>=0, its printed positive-parameter logarithmic-power CDF on the full square, and its independence member at zero. CI and both tails are checked across the full range: lower=1 for positive parameters and 0 at zero, upper=0 throughout. Nelsen 20 full-square parameter limits are checked: independence at zero along every nonnegative parameter path, including paths attaining zero, and M at infinity via an explicit CDF lower bound. Nelsen 20 increasing lower-orthant and both-direction Schur parameter orders are checked for every 0<=theta<=eta, including the independence endpoint through its checked zero limit. Convexity of the change between inverse generators gives the positive-parameter comparison. Nelsen 20 has an actual TP2 density throughout theta>=0. The mixed-derivative formula is identified with the copula measure for positive parameters using interior-rectangle integration, and the second inverse-generator derivative is log-convex; the zero member inherits the independence density. Nelsen 17 now has an actual copula measure constructor on both nonzero real parameter branches, its printed power CDF on the full closed square, and the independence identity at theta=-1. The generator sign conditions, convexity, monotonicity and inverse identity are checked. Nelsen 17 conditional monotonicity sufficiency is checked on both parameter branches: CI for theta>=-1 and CD for theta<=-1, always excluding zero. Log-convexity and log-concavity of the negative inverse-generator derivative give the respective actual CDF-section inequalities. Both Nelsen 17 tail coefficients are zero for every finite nonzero parameter, proved from the actual diagonal and its two endpoint derivatives. Nelsen 17 now has exact conditional and quadrant-dependence classifications for every nonzero parameter: CI and PQD iff theta>=-1, CD and NQD iff theta<=-1. Necessity is proved from the actual CDF-section derivative at zero and strict power-function convexity or concavity. Nelsen 17 now has its actual mixed-derivative density identified for every nonzero parameter, and density TP2 holds exactly when theta>=-1. Interior integration identifies the measure, log-convexity of the positive second inverse-generator derivative proves sufficiency, and the exact CI classification proves necessity. Nelsen 17 increasing lower-orthant order is checked for every ordered pair of nonzero parameters, including pairs across zero. Both-direction Schur order increases on theta>=-1 and decreases on theta<=-1, excluding zero. The explicit generator comparison is convex and superadditive by Bernoulli inequalities covering all exponent signs. Nelsen 17 full-square limits are checked at positive infinity (M) and at zero from either sign (exp(log(1+u)*log(1+v)/log(2))-1). A uniform diagonal bound proves the former, and continuous power-difference quotients prove the latter. Nelsen 17 also has its full-square negative-infinity limit checked: max(1,(1+u)*(1+v)/2)-1, including the cutoff curve and grounded axes. Nelsen 21 now has an actual measure constructor for every theta>=1, its printed nested-power CDF on the full closed square, and the countermonotonic member at theta=1. The generator is proved involutive, decreasing and convex on the unit interval, and its zero extension remains convex. Nelsen 21 now has both tails checked: lower=0 and upper=2-2^(1/theta). It is never PQD, CI or density TP2, proved by a positive zero-diagonal point. CD and NQD hold exactly at theta=1: the positive upper tail excludes both for theta>1. Nelsen 21 has full-square continuity at every finite admissible parameter, the limit to W at theta=1, and the limit to M at infinity. A uniform diagonal lower bound with factor (2*theta)^(1/theta) proves the infinite endpoint. Nelsen 21 increasing lower-orthant parameter order is checked for every 1<=theta<=eta, using a convex generator comparison on the unit interval and an explicit cutoff case. Its derivative monotonicity follows from Bernoulli inequality. Nelsen 21 is proved neither increasing nor decreasing in Schur parameter order. A strict median conditional-energy bound at theta=2 excludes the first direction using W at theta=1, and excludes the second using the limit to M and the median-strip energy inequality. An incomparable pair for the stronger interpretation of the unordered entry remains pending. Nelsen 18 now has its actual copula constructor for theta>=2, full-square CDF with the continuous unit endpoint, and the printed logarithmic formula below the unit edges. Both tails are checked (0,1); it is neither PQD nor NQD, neither CI nor CD, and never has a TP2 density. The positive zero-diagonal witness and a rational upper-tail limit establish these classifications, including theta=2. Nelsen 18 also has increasing lower-orthant parameter order for every 2<=theta<=eta, using the exact power relation between generators. Full-square finite-parameter continuity and convergence to M at infinity are checked, the latter via a normalized rational diagonal formula and copula bounds. Its unordered Schur entry remains pending. Nelsen 22 now has an actual constructor on [0,1], independence at zero, and both full-square and printed piecewise CDF formulas for positive theta. Both tails are zero throughout the range. A positive zero-diagonal witness excludes PQD for positive theta; CI and density TP2 each hold exactly at zero. The upper-tail proof uses the checked diagonal derivative at one. Nelsen 22 full-square parameter continuity is checked throughout [0,1], including the independence limit at zero for paths that may include zero values. A checked logarithmic derivative and continuous difference quotient prove the endpoint, with the cutoff controlled locally and axes treated exactly. Nelsen 22 CD and NQD are checked throughout [0,1]. A derivative-ratio CD criterion handles the finite cutoff, with differentiability and zero derivative at the cutoff and log-concavity before it proved explicitly. Nelsen 22 decreasing lower-orthant order and increasing Schur order in both directions are checked throughout 0<=theta<=eta<=1. Concavity of the exact trigonometric generator comparison follows from a squared-derivative inequality and Bernoulli inequality; subadditivity and a cutoff bound prove the CDF order, with NQD supplying the independence endpoint. Tawn now has full-square finite-shape continuity, increasing lower-orthant shape order, and convergence to Marshall-Olkin at infinite shape for all weights in [0,1]. Its unit-weight Gumbel subfamily has TP2 density and is non-independent for shape>1, formally refuting the blanket negative TP2 entry in arXiv v3 Table 5. The canonical Table 4 Pickands functions of Tawn, Gumbel, Marshall-Olkin and Cuadras-Auge are identified from their actual copulas on the full closed interval. Tawn CI and both directional Schur shape orders are now checked for all weights, by a general proof that max-product with independence preserves CI. The proof uses power-perspective concavity and includes zero and unit weights. Tawn density classification at other weights remains pending. The signed Frank family now has increasing lower-orthant order throughout the real line and both directional Schur orders on each side of independence, via its exact transformation to Nelsen 17. Frank Table 6 association formulas remain pending. Plackett now has an actual copula constructor for all theta>0, the full-square square-root CDF away from theta=1, the independence member at theta=1, and an identified Lebesgue density. Plackett CI/PQD hold exactly for theta>=1 and CD/NQD exactly for theta<=1, proved through section curvature and the midpoint CDF. Plackett has both zero tail coefficients for all finite positive parameters, full-square parameter continuity including independence, and endpoint limits W at zero and M at infinity. Plackett lower-orthant order is equivalent to parameter order, and both directional Schur orders increase above independence and decrease below it. The latter range is (0,1], correcting the empty theta<=0 range in arXiv v3 Table 5. Plackett admits no TP2 Lebesgue density outside [1,2]; necessity is proved for every density version using continuous boundary minors and a normalized polynomial limit. Plackett density TP2 is now completely classified: it holds exactly on [1,2]. Sufficiency follows from the checked mixed log-density derivative and a nonnegative integer Bernstein certificate on the closed unit cube, including theta=2. Its exact Spearman rho is now derived by integrating the actual CDF, including the independence value zero. A theta=2 counterexample refutes the doubled logarithmic term in arXiv v3 Table 6; the correct term is 2*theta*log(theta)/(theta-1)^2. Raftery source inconsistencies are checked: the literal Table 1 CDF violates the lower Frechet bound at delta=1/2, u=v=7/8; the declared independence endpoint has a TP2 density, and the declared comonotonic endpoint has upper tail one. The corrected Raftery family now has an actual copula constructor on the closed parameter interval, a full-square CDF for delta<1, and the exact independence and comonotonic endpoint identities. A mixture of products of scaled power CDFs proves uniform margins and nonnegative rectangle increments. Evaluating the mixture restores the missing factor 1/(1+delta). Raftery now has both exact tail coefficients for every delta<1, with both coefficients equal to one at delta=1, and full-square parameter continuity on the entire closed interval. The uniform CDF error from comonotonicity is at most 1-delta, proving the endpoint limit at one; continuity also proves the independence limit at zero. Raftery Spearman rho is now exactly delta*(4-3*delta)/(2-delta)^2 on the full closed interval, derived by Fubini from the bounded power-CDF mixture and its exact coordinate mean. Raftery now has exact absolute-continuity and density-TP2 classifications: both hold iff delta<1. The explicit mixed derivative is identified with the measure, including across the diagonal, and an antitone maximum-factor proof verifies every TP2 minor. A non-independent delta=1/2 counterexample refutes the printed exclusion. CI and PQD hold on [0,1], while CD and NQD each hold exactly at delta=0. Raftery now has increasing lower-orthant and both-direction Schur parameter orders on the whole closed interval. An exact power-integral representation shows that the gap from comonotonicity decreases with the shape parameter; CI transfers this to Schur order. Raftery Kendall tau is now exactly 2*delta/(3-delta) on the full closed interval, proved by integrating the actual CDF against its identified density. Symmetry and three exact power integrals give the interior value, and both endpoint values are separately checked. For arbitrary max-stable bivariate copulas, canonical Pickands bounds and homogeneous, submodular, coordinate-Lipschitz logarithmic structure are now derived without density assumptions. Convexity of the logarithmic sections is now proved without regularity assumptions: homogeneity and submodularity imply geometric Jensen comparisons, and a compact-maximum argument upgrades these to ordinary convexity. The supporting-line transfer to CDF-section concavity and general CI, and full canonical Pickands convexity, remain pending. Other family entries, remaining general order correspondences and journal comparison remain pending."
