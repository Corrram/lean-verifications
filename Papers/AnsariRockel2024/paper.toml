[[source_discrepancies]]
version = "arXiv:2310.17307v3, Tables 1, 4-5 and Appendix A.4.1; corresponding journal cells not checked"
unverified_claim = "The printed Raftery CDF is a copula, no Raftery parameter has a density, its non-independent members lack TP2 density, and its upper tail is zero throughout the closed parameter interval."
