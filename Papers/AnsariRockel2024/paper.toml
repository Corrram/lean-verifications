[[source_discrepancies]]
version = "arXiv:2310.17307v3, Tables 1, 4-5 and Appendix A.4.1; corresponding journal cells not checked"
unverified_claim = "The printed Raftery CDF is a copula, no Raftery parameter has a density, its non-independent members lack TP2 density, and its upper tail is zero throughout the closed parameter interval."
evidence = "The printed CDF is below the lower Frechet bound at delta=1/2, u=v=7/8. Independence has a TP2 density; comonotonicity has upper tail one."
verified_instead = "The literal CDF is formally refuted. An actual copula construction verifies the CDF with the missing factor 1/(1+delta) restored and verifies the stated endpoint identities. Absolute continuity and TP2 density hold exactly for delta<1; a non-independent delta=1/2 member refutes the printed exclusion. CI and PQD hold throughout [0,1], and CD/NQD hold only at zero."

[[source_discrepancies]]
version = "arXiv:2310.17307v3, Table 6, PDF page 19 and HTML; journal cell not checked"
unverified_claim = "The printed Gaussian xi expression has a real arcsine argument on the full signed correlation range."
evidence = "Its literal argument 1/2+r^2/(1+r) exceeds one throughout -1<r<-1/2 and equals 11/4 at r=-3/4, an admissible Gaussian correlation."
verified_instead = "The domain failure is formally checked. Moreover, the literal formula is refuted at the admissible pair r=+/-1/2 by its unequal values, contradicting the proved evenness of actual Gaussian xi. Both arcsine arguments are within [-1,1]. The corrected formula (3/pi)*arcsin((1+r^2)/2)-1/2 is proved for every r in [-1,1]."

[[source_discrepancies]]
version = "arXiv:2310.17307v3, Appendix A.3.3; journal passage not checked"
unverified_claim = "Both Gaussian tail coefficients are one at both signed singular correlations."
evidence = "At r=-1 the actual Gaussian copula is countermonotonic, and both checked tail limits are zero."
verified_instead = "Both coefficients are zero for -1<=r<1 and one at r=1. Uniqueness of limits formally excludes the printed value at r=-1."

[[source_discrepancies]]
version = "arXiv v3 HTML Table 1; PDF and journal cell unchecked"
unverified_claim = "The printed Student-t density with correlation rho in the dimension slots agrees pointwise with the actual standard bivariate density."
