scope = "Blest normalization, range, mixtures, reflection symmetry, the xi=0 endpoint, entire xi=1 boundary, convexity of the full region, and attainment from any existing point up to xi=1 at fixed Blest value are checked. Closedness, compactness, and attainment of both Blest extrema at each xi and the least xi at each Blest value are now checked. The clamped extremal family, its unique normalization, and unique Blest maximality at each constructed positive-slope point are checked. Every intermediate xi value is reached, and the full region is characterized by the constructed family with unique upper boundary copulas. The coefficient formulas for 0<=b<=1 and the exact maximal gap 44/105, including all equality cases, are checked. Strict monotonicity and uniqueness of every interior parameter are also checked. Coefficient formulas for b>1 and journal comparison remain pending."
