name: Handbook and Lean reference

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  # Let a running build/deployment finish and populate its reusable cache.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SITE_BASE: /lean-verifications/
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          build: 'true'
          test: 'false'
          use-mathlib-cache: 'true'
      - name: Restore documentation build cache
        id: docs-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            docbuild/.lake
            .lake/packages/doc-gen4/.lake
            .lake/packages/leansqlite/.lake
            .lake/packages/UnicodeBasic/.lake
            .lake/packages/BibtexQuery/.lake
            .lake/packages/MD4Lean/.lake
          key: docs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: docs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lake-manifest.json') }}-
      - name: Include all project modules and refresh rendered documentation
        run: python scripts/prepare_docs.py
      - name: Build the pinned doc-gen4 reference
        working-directory: docbuild
        env:
          LEAN_NUM_THREADS: '2'
        run: /usr/bin/time -v lake build Handbook:docs
      - name: Save documentation build cache
        uses: actions/cache/save@v5
        with:
          path: |
            docbuild/.lake
            .lake/packages/doc-gen4/.lake
            .lake/packages/leansqlite/.lake
            .lake/packages/UnicodeBasic/.lake
            .lake/packages/BibtexQuery/.lake
            .lake/packages/MD4Lean/.lake
          key: ${{ steps.docs-cache.outputs.cache-primary-key }}
      - name: Build and check the handbook and API links
        working-directory: website
        run: |
          npm ci
          npm run build
          npm run check
      - name: Check that dependency pins are unchanged
        run: git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json docbuild/lean-toolchain docbuild/lakefile.toml docbuild/lake-manifest.json website/package-lock.json
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload the complete website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
