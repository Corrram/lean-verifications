name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: leanprover/lean-action@v1
        with:
          build: "true"
          test: "false"
          use-mathlib-cache: "true"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check advertised verification coverage and axiom audits
        run: |
          python scripts/test_check_verification.py
          python scripts/check_verification.py
      - name: Check that the build preserves dependency pins
        run: git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
